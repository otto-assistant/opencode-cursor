name: CI

on:
  pull_request:
    branches:
      - beta
  push:
    branches:
      - beta

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact dependencies
        run: bun install --frozen-lockfile

      - name: Verify V2 beta package
        run: npm run verify
