name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version (e.g., 0.3.0). If empty, bump type is used.'
        required: false
        type: string
      bump:
        description: 'Version bump type (used if version is empty)'
        required: false
        default: 'minor'
        type: choice
        options:
          - minor
          - patch
          - major
      dry_run:
        description: 'Validate only; skip npm publish and repository writes'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '22'
  PACKAGE_TAG_PREFIX: 'opencode-cursor-auth-v'

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Get current version from package.json
        id: current_version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Calculate new version
        id: version
        env:
          CURRENT_VERSION: ${{ steps.current_version.outputs.version }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          BUMP_TYPE: ${{ github.event.inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_VERSION" ]]; then
            # Validate semver
            if ! echo "$INPUT_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Error: version must be in semver format X.Y.Z"
              exit 1
            fi
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          elif ! git rev-parse -q --verify "refs/tags/${PACKAGE_TAG_PREFIX}${CURRENT_VERSION}" >/dev/null; then
            # The repository has legacy v0.x tags. This package has its own tag
            # namespace and starts from the version already in package.json.
            echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          elif ! gh release view "${PACKAGE_TAG_PREFIX}${CURRENT_VERSION}" >/dev/null 2>&1; then
            # Resume a release whose tag was pushed but whose GitHub release was
            # not created. npm publication is checked separately and is idempotent.
            echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          else
            IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
            case "$BUMP_TYPE" in
              major) echo "version=$((major+1)).0.0" >> "$GITHUB_OUTPUT" ;;
              minor) echo "version=$major.$((minor+1)).0" >> "$GITHUB_OUTPUT" ;;
              patch) echo "version=$major.$minor.$((patch+1))" >> "$GITHUB_OUTPUT" ;;
              *) echo "Error: unknown bump type $BUMP_TYPE"; exit 1 ;;
            esac
          fi

      - name: Show version info
        run: |
          echo "Current version: ${{ steps.current_version.outputs.version }}"
          echo "New version:     ${{ steps.version.outputs.version }}"
          echo "Package tag:     ${{ env.PACKAGE_TAG_PREFIX }}${{ steps.version.outputs.version }}"
          echo "Dry run:         ${{ github.event.inputs.dry_run == 'true' && 'yes' || 'no' }}"

      - name: Update package version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "${VERSION}" --no-git-tag-version --allow-same-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build package
        run: bun run build

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Commit and tag
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git ls-files --modified --others | grep -q bun.lock; then
            git add bun.lock
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: release v${VERSION}"
          fi
          TAG="${PACKAGE_TAG_PREFIX}${VERSION}"
          if git show-ref --tags --verify --quiet "refs/tags/${TAG}"; then
            if [[ "$(git rev-list -n 1 "${TAG}")" != "$(git rev-parse HEAD)" ]]; then
              echo "Error: ${TAG} already points to a different commit"
              exit 1
            fi
          else
            git tag "${TAG}"
          fi
          git push origin HEAD:main
          git push origin "${TAG}"

      - name: Publish to npm
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: '@otto-assistant/opencode-cursor-auth'
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PUBLISHED="$(npm view "${PACKAGE_NAME}@${VERSION}" version 2>/dev/null || true)"
          if [[ "$PUBLISHED" == "$VERSION" ]]; then
            echo "${PACKAGE_NAME}@${VERSION} is already published; continuing the release."
          else
            npm publish --access public
          fi

      - name: Create GitHub Release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PACKAGE_TAG_PREFIX }}${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          name: opencode-cursor-auth v${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Discord notification
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGE_TAG: ${{ env.PACKAGE_TAG_PREFIX }}${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set; skipping Discord notification."
            exit 0
          fi
          node - <<'NODE'
          (async () => {
            const tag = process.env.PACKAGE_TAG;
            const repo = process.env.REPOSITORY;
            const releaseRes = await fetch(`https://api.github.com/repos/${repo}/releases/tags/${tag}`, {
              headers: {
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                Accept: 'application/vnd.github+json',
              },
            });
            if (!releaseRes.ok) {
              const body = await releaseRes.text();
              throw new Error(`Failed to fetch release ${tag}: ${releaseRes.status} ${body}`);
            }
            const release = await releaseRes.json();
            const description = (release.body || `opencode-cursor-auth ${tag} released.`).slice(0, 4096);
            const payload = {
              username: 'opencode-cursor-auth Releases',
              embeds: [
                {
                  title: release.name || `opencode-cursor-auth ${tag}`,
                  url: release.html_url,
                  description,
                  color: 3447003,
                  footer: { text: 'opencode-cursor-auth Changelog' },
                },
              ],
            };
            const discordRes = await fetch(process.env.DISCORD_WEBHOOK_URL, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify(payload),
            });
            if (!discordRes.ok) {
              const body = await discordRes.text();
              throw new Error(`Failed to send Discord notification: ${discordRes.status} ${body}`);
            }
            console.log('Discord notification sent successfully');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
