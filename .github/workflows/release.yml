name: Release V2 Beta

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify and pack without publishing
        required: true
        default: true
        type: boolean

concurrency:
  group: opencode-cursor-v2-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.ref_name == 'beta'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Validate prerelease version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # Version bumps are reviewed separately; this workflow publishes package.json verbatim.
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "Expected package version X.Y.Z-beta.N, got: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install exact dependencies
        run: bun install --frozen-lockfile

      - name: Verify source and installed artifact
        run: npm run verify

      - name: Pack exact release artifact
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          output="$(npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP")"
          filename="$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(0,"utf8")); process.stdout.write(x[0].filename)' <<<"$output")"
          echo "path=$RUNNER_TEMP/$filename" >> "$GITHUB_OUTPUT"

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-cursor-v2-${{ steps.version.outputs.version }}
          path: ${{ steps.pack.outputs.path }}

      - name: Publish verified artifact
        if: inputs.dry_run == false
        run: npm publish "${{ steps.pack.outputs.path }}" --tag beta --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub prerelease
        if: inputs.dry_run == false
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: true
          name: v${{ steps.version.outputs.version }}

      - name: Send Discord notification
        if: inputs.dry_run == false
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set; skipping Discord notification."
            exit 0
          fi
          node - <<'NODE'
          (async () => {
            const tag = `v${process.env.VERSION}`;
            const repo = process.env.REPOSITORY;
            const releaseRes = await fetch(`https://api.github.com/repos/${repo}/releases/tags/${tag}`, {
              headers: {
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                Accept: 'application/vnd.github+json',
              },
            });
            if (!releaseRes.ok) {
              const body = await releaseRes.text();
              throw new Error(`Failed to fetch release ${tag}: ${releaseRes.status} ${body}`);
            }
            const release = await releaseRes.json();
            const description = (release.body || `opencode-cursor-oauth ${tag} released.`).slice(0, 4096);
            const payload = {
              username: 'opencode-cursor-oauth Releases',
              embeds: [
                {
                  title: release.name || `opencode-cursor-oauth ${tag}`,
                  url: release.html_url,
                  description,
                  color: 3447003,
                  footer: { text: 'opencode-cursor-oauth Changelog' },
                },
              ],
            };
            const discordRes = await fetch(process.env.DISCORD_WEBHOOK_URL, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify(payload),
            });
            if (!discordRes.ok) {
              const body = await discordRes.text();
              throw new Error(`Failed to send Discord notification: ${discordRes.status} ${body}`);
            }
            console.log('Discord notification sent successfully');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
